[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-geo-guard"
version = "0.3.0"
description = "Best-effort Linux and macOS launch and runtime geolocation guard for Claude"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
claude-geo-guard = "claude_geo_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_geo_guard*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
