name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_network:
        description: 'Run live egress checks (location-dependent)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ubuntu:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-22.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y desktop-file-utils iproute2 zsh tzdata
      - run: python -m venv .venv && .venv/bin/pip install -r requirements/dev.txt
      - run: make check
      - run: make package
  macos:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements/dev.txt
      - run: make lint
      - run: .venv/bin/python -m pytest -q tests/test_macos.py tests/test_bootstrap.py tests/test_checker.py tests/test_trace.py tests/test_settings_manager.py tests/test_ip_policy.py -k 'not enabled_guarded_launch and not real_adapter_with_fake_utilities'
        env:
          GUARD_CI_LAUNCHD: '1'
      - run: make package
  distributions:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata git python3 python3-venv curl ca-certificates iproute2 desktop-file-utils zsh make
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements/dev.txt
      - run: make check
  live-network:
    if: github.event_name == 'workflow_dispatch' && inputs.live_network
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Live fail-closed smoke (GB and non-GB runners are both valid)
        shell: bash
        run: |
          set +e
          python3 -I run.py check > verdict.json
          result=$?
          set -e
          python3 - "$result" <<'PY'
          import json, sys
          verdict = json.load(open('verdict.json'))
          expected = 0 if verdict['allowed'] else 2
          assert int(sys.argv[1]) == expected
          print("Live check completed with expected exit status")
          PY
